<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drafarig Teams (mockup)</title>
<style>
:root {
  --bg:#14171d; --panel:#1d222b; --panel2:#232a35; --ink:#e7eaf0; --muted:#9aa3b3; --line:#2e3542; --accent:#7d9bff;
  --ok:#5fd0b5; --okbg:#163a33; --warn:#ffb35c; --warnbg:#3d2b12; --bad:#ff8a80; --badbg:#431c1a; --plus:#ff9e7a; --minus:#7fb2ff; --thumb:16px;
}
* { box-sizing:border-box; }
body { margin:0; font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
button,input,select,textarea { font:inherit; color:inherit; }
button { cursor:pointer; background:var(--panel2); border:1px solid var(--line); border-radius:6px; padding:4px 10px; min-height:32px; }
button:hover { border-color:var(--accent); } button:disabled { opacity:.45; cursor:default; }
button.primary { background:var(--accent); border-color:var(--accent); color:#0d1220; font-weight:600; }
button.link { background:none; border-color:transparent; color:var(--accent); padding:2px 4px; }
button.chip { border-radius:999px; font-size:12px; padding:2px 10px; min-height:28px; }
button.chip.on { background:var(--accent); color:#0d1220; border-color:var(--accent); }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
input[type=text], select, textarea { background:var(--bg); border:1px solid var(--line); border-radius:5px; padding:4px 7px; min-height:30px; }
.muted { color:var(--muted); } .small { font-size:12px; } .tiny { font-size:11px; }
.topbar { display:flex; align-items:center; gap:12px; padding:8px 16px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
.brand { font-weight:800; letter-spacing:.08em; }
.mocknote { margin-left:auto; font-size:11px; color:var(--warn); }
.wrap { max-width:1180px; margin:0 auto; padding:12px 16px 90px; }
.crumbs { display:flex; gap:6px; align-items:center; font-size:13px; margin-bottom:8px; flex-wrap:wrap; }
h2 { font-size:18px; margin:4px 0 10px; } h3 { font-size:14px; margin:14px 0 6px; }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:12px; }
.notice { background:var(--okbg); border:1px solid var(--ok); border-radius:8px; padding:8px 12px; margin-bottom:12px; font-size:13px; }
.notice ul { margin:4px 0; padding-left:18px; }
.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.sprite { flex:none; width:40px; height:40px; border-radius:50%; display:grid; place-items:center; font-weight:800; font-size:12px; color:#0d1220; }
.sprite.sm { width:26px; height:26px; font-size:10px; } .sprite.lg { width:84px; height:84px; font-size:24px; border-radius:14px; }
.sprite.empty { background:var(--bg) !important; border:1px dashed var(--line); color:var(--muted); }
.type { font-size:10px; font-weight:700; padding:1px 6px; border-radius:4px; color:#0d1220; }
.badge { font-size:11px; padding:0 7px; border-radius:999px; border:1px solid var(--line); color:var(--muted); white-space:nowrap; }
.badge.warn { color:var(--warn); border-color:var(--warn); } .badge.ok { color:var(--ok); border-color:var(--ok); }

/* teams list */
.teams { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:10px; }
.tcard { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px; display:flex; flex-direction:column; gap:8px; }
.tcard.box { border-style:dashed; }
.tcard .name { font-weight:700; font-size:15px; text-align:left; background:none; border:0; padding:0; min-height:0; }
.tcard .six { display:flex; gap:4px; flex-wrap:wrap; }
.matchups { display:flex; gap:8px; flex-wrap:wrap; }
.mu { display:flex; align-items:center; gap:6px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px 8px; font-size:13px; }
.mu select { font-size:12px; }

/* team builder: Showdown team view */
.slots { display:flex; flex-direction:column; gap:6px; }
.slot { display:grid; grid-template-columns:44px minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr) auto; gap:10px; align-items:center; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
.slot .open { all:unset; cursor:pointer; display:contents; }
.slot .nm { font-weight:700; } .slot .sub { font-size:12px; color:var(--muted); }
.slot .mv { font-size:12px; line-height:1.5; }
.slot .st { font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; }
.slot.emptyslot { border-style:dashed; }
.menu { position:relative; }
.menu .pop { position:absolute; right:0; top:100%; z-index:20; background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:4px; display:flex; flex-direction:column; min-width:170px; }
.menu .pop button { text-align:left; border:0; background:none; }
.menu .pop button:hover { background:var(--panel); }
.warns { display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--warn); margin:6px 0; }

/* set editor (compact: the full editor is teambuilder.html / the live app) */
.ed { display:grid; grid-template-columns:110px minmax(0,1fr) minmax(0,1fr); gap:14px; align-items:start; }
.field { display:flex; flex-direction:column; gap:2px; margin-bottom:6px; min-width:0; }
.field > span { font-size:11px; color:var(--muted); }
.field input, .field select { width:100%; }
.teamstrip { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
.teamstrip button { display:flex; align-items:center; gap:6px; padding:4px 8px; }
.teamstrip button.sel { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
.strip { margin:10px 0; padding:8px 10px; background:var(--panel2); border:1px solid var(--line); border-radius:8px; }
.hits { display:grid; grid-template-columns:repeat(auto-fill, minmax(190px,1fr)); gap:8px; }
.hit { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px 8px; }
.hit .who { display:flex; gap:6px; align-items:center; font-weight:600; font-size:13px; }
.hit .src { font-size:11px; color:var(--muted); margin:2px 0 4px; }
.hit button.v { display:flex; width:100%; justify-content:space-between; gap:6px; font-size:12px; margin-top:3px; background:var(--bg); }
.v b.ko { color:var(--ok); }
.srow { display:grid; grid-template-columns:48px minmax(0,1fr) 40px 40px; gap:10px; align-items:center; padding:5px 0; border-top:1px solid var(--line); }
.srow:first-child { border-top:0; }
.sname { font-weight:700; } .sname.plus { color:var(--plus); } .sname.minus { color:var(--minus); }
.fin { font-weight:700; text-align:right; font-variant-numeric:tabular-nums; }
.num { text-align:right; font-variant-numeric:tabular-nums; }
.slidew { position:relative; padding-bottom:18px; }
input[type=range] { width:100%; margin:0; accent-color:var(--accent); }
.ticks { position:absolute; left:0; right:0; top:20px; height:16px; }
.tick { position:absolute; top:0; transform:translateX(-50%); width:14px; height:16px; padding:0; min-height:0; border:0; background:none; }
.tick::before { content:""; position:absolute; left:3px; top:1px; width:8px; height:8px; border-radius:50%; border:2px solid var(--muted); background:var(--bg); }
.tick.met::before { background:var(--ok); border-color:var(--ok); }
.marklbl { font-size:11px; color:var(--muted); margin-top:2px; }
.marklbl button { font-size:11px; }

/* workbench */
.wbback { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:40; display:flex; align-items:flex-start; justify-content:center; padding:24px 12px; overflow:auto; }
.wb { width:min(980px, 100%); background:var(--panel); border:1px solid var(--line); border-radius:12px; box-shadow:0 12px 40px rgba(0,0,0,.5); }
.wbhead { position:sticky; top:0; z-index:2; background:var(--panel); border-bottom:1px solid var(--line); padding:10px 14px; border-radius:12px 12px 0 0; }
.wbhead .t { display:flex; align-items:center; gap:8px; }
.wbhead .t b { font-size:15px; }
.wbhead .x { margin-left:auto; min-width:40px; }
.headline { font-size:20px; font-weight:800; margin-top:4px; }
.headline.ko { color:var(--ok); }
.rolls { display:grid; grid-template-columns:repeat(16, 1fr); gap:2px; margin:6px 0 4px; max-width:420px; }
.rolls span { height:10px; border-radius:2px; background:var(--line); }
.rolls span.k { background:var(--ok); }
.chips { display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; }
.chips span { font-size:11px; border:1px solid var(--line); border-radius:999px; padding:0 8px; color:var(--muted); }
.wbtabs { display:none; }
.wbbody { display:grid; grid-template-columns:1fr 1fr; gap:0; }
.side { padding:12px 14px; border-right:1px solid var(--line); }
.side:last-child { border-right:0; }
.side h4 { margin:0 0 4px; font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
.side .src { font-size:12px; color:var(--warn); margin-bottom:6px; }
.side .src.edited { color:var(--accent); }
.field2 { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.wbfield { padding:10px 14px; border-top:1px solid var(--line); }
.wbfoot { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:10px 14px; border-top:1px solid var(--line); position:sticky; bottom:0; background:var(--panel); border-radius:0 0 12px 12px; }
.seg { display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
.seg button { border:0; border-radius:0; min-height:28px; font-size:12px; }
.seg button.on { background:var(--accent); color:#0d1220; }
.more summary { cursor:pointer; font-size:12px; color:var(--muted); margin:4px 0; }
#toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:8px 14px; border-radius:6px; z-index:60; max-width:90vw; }
dialog { background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:10px; width:min(560px, calc(100vw - 24px)); }
dialog textarea { width:100%; height:240px; font:12px/1.4 ui-monospace,Menlo,monospace; }
dialog::backdrop { background:rgba(0,0,0,.5); }
.pick { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:6px; }
.pick button { display:flex; gap:6px; align-items:center; }

@media (max-width: 820px) {
  .slot { grid-template-columns:40px minmax(0,1fr) auto; }
  .slot .mv, .slot .st { display:none; }
  .ed { grid-template-columns:minmax(0,1fr); }
}
@media (max-width: 767px) {
  .wbback { padding:0; }
  .wb { width:100%; min-height:100vh; border-radius:0; border:0; }
  .wbhead { border-radius:0; }
  .wbtabs { display:flex; position:sticky; top:var(--headh, 0); z-index:1; background:var(--panel); border-bottom:1px solid var(--line); }
  .wbtabs button { flex:1; border:0; border-radius:0; min-height:44px; background:none; border-bottom:3px solid transparent; }
  .wbtabs button.on { border-bottom-color:var(--accent); font-weight:700; }
  .wbbody { grid-template-columns:1fr; }
  .side { border-right:0; }
  .wb[data-tab="you"] .side.them, .wb[data-tab="you"] .wbfield,
  .wb[data-tab="them"] .side.you, .wb[data-tab="them"] .wbfield,
  .wb[data-tab="field"] .side { display:none; }
  .wbfoot { border-radius:0; }
  button, select { min-height:44px; } .tick { min-height:0; }
}
</style>
</head>
<body>
<header class="topbar"><span class="brand">DRAFARIG</span><span class="small muted">Battle Prep › Teams</span>
  <span class="mocknote">Clickable mockup · damage from the standard Gen 9 formula (checked against the app's goldens); the app uses its engine · nothing is saved</span></header>
<div class="wrap" id="app"></div>
<div id="wbroot"></div>
<div id="toast" hidden></div>
<dialog id="dlg"><form method="dialog" id="dlgform"></form></dialog>

<script>
"use strict";
// ======================================================================================================================
// Mechanics (mockup): Champions stats (lib/calc/stats.mjs statValue) and the standard Gen 9 damage order
// (base → spread → weather → crit → random → STAB → type → final mods). Reproduces the reference goldens in
// docs/research/strategy/sp-assist (e.g. Thunderbolt 152–182, Life Orb 198–237, Weather Ball 336–396).
// ======================================================================================================================
const STATS = ['hp','atk','def','spa','spd','spe'];
const SHORT = { hp:'HP', atk:'Atk', def:'Def', spa:'SpA', spd:'SpD', spe:'Spe' };
const NAT = { Hardy:[], Lonely:['atk','def'], Brave:['atk','spe'], Adamant:['atk','spa'], Naughty:['atk','spd'], Bold:['def','atk'], Relaxed:['def','spe'],
  Impish:['def','spa'], Lax:['def','spd'], Timid:['spe','atk'], Hasty:['spe','def'], Jolly:['spe','spa'], Naive:['spe','spd'], Modest:['spa','atk'],
  Mild:['spa','def'], Quiet:['spa','spe'], Rash:['spa','spd'], Calm:['spd','atk'], Gentle:['spd','def'], Sassy:['spd','spe'], Careful:['spd','spa'], Serious:[] };
const sign = (n, s) => { const x = NAT[n] || []; return x[0] === s ? '+' : x[1] === s ? '-' : ''; };
const tr = Math.trunc;
function statValue(s, base, sp, sg) { if (s === 'hp') return base + sp + 75; const v = base + sp + 20; return sg === '+' ? Math.floor(v * 1.1) : sg === '-' ? Math.floor(v * 0.9) : v; }
const boost = (v, st) => (st >= 0 ? Math.floor(v * (2 + st) / 2) : Math.floor(v * 2 / (2 - st)));
const modify = (v, m) => tr((tr(v * m) + 2047) / 4096);
const chain = (ms) => ms.reduce((m, x) => (m * x + 2048) >> 12, 4096);
const CHART = {
  Normal:{Rock:.5,Ghost:0,Steel:.5}, Fire:{Fire:.5,Water:.5,Grass:2,Ice:2,Bug:2,Rock:.5,Dragon:.5,Steel:2},
  Water:{Fire:2,Water:.5,Grass:.5,Ground:2,Rock:2,Dragon:.5}, Electric:{Water:2,Electric:.5,Grass:.5,Ground:0,Flying:2,Dragon:.5},
  Grass:{Fire:.5,Water:2,Grass:.5,Poison:.5,Ground:2,Flying:.5,Bug:.5,Rock:2,Dragon:.5,Steel:.5}, Ice:{Fire:.5,Water:.5,Grass:2,Ice:.5,Ground:2,Flying:2,Dragon:2,Steel:.5},
  Fighting:{Normal:2,Ice:2,Poison:.5,Flying:.5,Psychic:.5,Bug:.5,Rock:2,Ghost:0,Dark:2,Steel:2,Fairy:.5}, Poison:{Grass:2,Poison:.5,Ground:.5,Rock:.5,Ghost:.5,Steel:0,Fairy:2},
  Ground:{Fire:2,Electric:2,Grass:.5,Poison:2,Flying:0,Bug:.5,Rock:2,Steel:2}, Flying:{Electric:.5,Grass:2,Fighting:2,Bug:2,Rock:.5,Steel:.5},
  Psychic:{Fighting:2,Poison:2,Psychic:.5,Dark:0,Steel:.5}, Bug:{Fire:.5,Grass:2,Fighting:.5,Poison:.5,Flying:.5,Psychic:2,Ghost:.5,Dark:2,Steel:.5,Fairy:.5},
  Rock:{Fire:2,Ice:2,Fighting:.5,Ground:.5,Flying:2,Bug:2,Steel:.5}, Ghost:{Normal:0,Psychic:2,Ghost:2,Dark:.5}, Dragon:{Dragon:2,Steel:.5,Fairy:0},
  Dark:{Fighting:.5,Psychic:2,Ghost:2,Dark:.5,Fairy:.5}, Steel:{Fire:.5,Water:.5,Electric:.5,Ice:2,Rock:2,Steel:.5,Fairy:2}, Fairy:{Fire:.5,Fighting:2,Poison:.5,Dragon:2,Dark:2,Steel:.5},
};
const eff = (t, defTypes) => defTypes.reduce((m, d) => m * (CHART[t]?.[d] ?? 1), 1);
const TYPE_COLOR = { Electric:'#f4d23c', Flying:'#8fa8dd', Fire:'#ff9d55', Water:'#4d90d5', Grass:'#63bb5b', Ghost:'#6a6dc0', Fighting:'#ce4069', Normal:'#9099a1',
  Dark:'#5a5366', Fairy:'#ec8fe6', Steel:'#5a8ea1', Ground:'#d97746', Ice:'#73cec0', Bug:'#90c12c', Rock:'#c7b78b', Poison:'#ab6ac8', Psychic:'#f97176', Dragon:'#0b6dc3' };

// Species (data/mechanics.json, cloud-checkpoint). mega: { item, forme } for the Megas used here.
const SP = {
  charizard:{ n:'Charizard', t:['Fire','Flying'], b:[78,84,78,109,85,100], ab:['Blaze','Solar Power'], mega:{ item:'Charizardite Y', forme:'charizardmegay' } },
  charizardmegay:{ n:'Mega Charizard Y', t:['Fire','Flying'], b:[78,104,78,159,115,100], ab:['Drought'] },
  rotomfan:{ n:'Rotom-Fan', t:['Electric','Flying'], b:[50,65,107,105,107,86], ab:['Levitate'] },
  pelipper:{ n:'Pelipper', t:['Water','Flying'], b:[60,50,100,95,70,65], ab:['Drizzle'] },
  sinistcha:{ n:'Sinistcha', t:['Grass','Ghost'], b:[71,60,106,121,80,70], ab:['Hospitality','Heatproof'] },
  kangaskhan:{ n:'Kangaskhan', t:['Normal'], b:[105,95,80,40,80,90], ab:['Scrappy','Inner Focus','Early Bird'] },
  aegislash:{ n:'Aegislash', t:['Steel','Ghost'], b:[60,50,140,50,140,60], ab:['Stance Change'] },
  morpeko:{ n:'Morpeko', t:['Electric','Dark'], b:[58,95,58,70,58,97], ab:['Hunger Switch'] },
  conkeldurr:{ n:'Conkeldurr', t:['Fighting'], b:[105,140,95,55,65,45], ab:['Iron Fist','Guts','Sheer Force'] },
  stunfiskgalar:{ n:'Stunfisk-Galar', t:['Ground','Steel'], b:[109,81,99,66,84,32], ab:['Mimicry'] },
  simipour:{ n:'Simipour', t:['Water'], b:[75,98,63,98,63,101], ab:['Torrent','Gluttony'] },
  staraptormega:{ n:'Mega Staraptor', t:['Fighting','Flying'], b:[85,140,100,60,90,110], ab:['Contrary'] },
  grimmsnarl:{ n:'Grimmsnarl', t:['Dark','Fairy'], b:[95,120,65,95,75,60], ab:['Prankster'] },
  volcarona:{ n:'Volcarona', t:['Bug','Fire'], b:[85,60,65,135,105,100], ab:['Flame Body'] },
  basculegionf:{ n:'Basculegion-F', t:['Water','Ghost'], b:[120,92,65,100,75,78], ab:['Adaptability'] },
  tsareena:{ n:'Tsareena', t:['Grass'], b:[72,120,98,50,98,72], ab:['Queenly Majesty'] },
};
const DRAFTED = ['charizard','sinistcha','pelipper','kangaskhan','aegislash','morpeko','conkeldurr','rotomfan','stunfiskgalar','simipour'];
const MOVES = {
  'Thunderbolt':{ bp:90, t:'Electric', c:'S' }, 'Air Slash':{ bp:75, t:'Flying', c:'S' }, 'Discharge':{ bp:80, t:'Electric', c:'S', spread:true },
  'Volt Switch':{ bp:70, t:'Electric', c:'S' }, 'Shadow Ball':{ bp:80, t:'Ghost', c:'S' }, 'Heat Wave':{ bp:95, t:'Fire', c:'S', spread:true },
  'Weather Ball':{ bp:50, t:'Normal', c:'S', wb:true }, 'Solar Beam':{ bp:120, t:'Grass', c:'S' }, 'Flamethrower':{ bp:90, t:'Fire', c:'S' },
  'Brave Bird':{ bp:120, t:'Flying', c:'P' }, 'Close Combat':{ bp:120, t:'Fighting', c:'P' },
  'Protect':{ status:true }, 'Nasty Plot':{ status:true, setup:'spa' }, 'Tailwind':{ status:true }, 'Helping Hand':{ status:true }, 'Will-O-Wisp':{ status:true },
};
const LEARN = { rotomfan:['Thunderbolt','Air Slash','Discharge','Volt Switch','Shadow Ball','Protect','Nasty Plot','Helping Hand','Will-O-Wisp'],
  charizard:['Heat Wave','Weather Ball','Solar Beam','Flamethrower','Air Slash','Protect'] };
const ITEMS = ['', 'Sitrus Berry', 'Life Orb', 'Mental Herb', 'Magnet', 'Expert Belt', 'Focus Sash', 'Leftovers', 'Charizardite Y', 'Staraptite', 'Light Clay', 'Wide Lens'];

// Damage. side = { sp(species id), set:{item, ability, nature, sp:{}}, boosts:{}, hp% } ; f = field
function forme(spId, set) { const s = SP[spId]; return s.mega && set.item === s.mega.item ? s.mega.forme : spId; }
function stats(spId, set) { const f = SP[forme(spId, set)]; return Object.fromEntries(STATS.map((k, i) => [k, statValue(k, f.b[i], set.sp[k] || 0, sign(set.nature, k))])); }
function damage(att, def, moveName, f) {
  const mv = MOVES[moveName]; if (!mv || mv.status) return null;
  const aF = SP[forme(att.sp, att.set)], dF = SP[forme(def.sp, def.set)];
  let type = mv.t, bp = mv.bp;
  if (mv.wb && f.weather) { bp = 100; type = { sun:'Fire', rain:'Water', sand:'Rock', snow:'Ice' }[f.weather]; }
  const phys = mv.c === 'P', aKey = phys ? 'atk' : 'spa', dKey = phys ? 'def' : 'spd';
  const as = stats(att.sp, att.set), ds = stats(def.sp, def.set);
  const out = (crit) => {
    let aStage = (att.boosts?.[aKey] || 0) - (phys ? (f.intim || 0) : 0), dStage = def.boosts?.[dKey] || 0;
    if (crit) { aStage = Math.max(0, aStage); dStage = Math.min(0, dStage); }
    const A = boost(as[aKey], aStage), D = boost(ds[dKey], dStage);
    const bpm = []; if (f.hh) bpm.push(6144); if (att.set.item === 'Magnet' && type === 'Electric') bpm.push(4915);
    const B = bpm.length ? Math.max(1, modify(bp, chain(bpm))) : bp;
    let base = tr(tr(tr(22 * B * A / D) / 50)) + 2;
    if (mv.spread && f.spread) base = modify(base, 3072);
    if (f.weather === 'sun' && type === 'Fire' || f.weather === 'rain' && type === 'Water') base = modify(base, 6144);
    if (f.weather === 'sun' && type === 'Water' || f.weather === 'rain' && type === 'Fire') base = modify(base, 2048);
    if (crit) base = modify(base, 6144);
    const e = eff(type, dF.t);
    const fin = [];
    if (!crit && (phys ? f.reflect : f.screen)) fin.push(2732);
    if (att.set.item === 'Expert Belt' && e > 1) fin.push(4915);
    if (att.set.item === 'Life Orb') fin.push(5324);
    const rolls = [];
    for (let r = 85; r <= 100; r++) {
      let d = tr(base * r / 100);

  if (el.dataset.wbf) { const [who, k] = el.dataset.wbf.split(':'); S.wb[who].set[k] = el.value; if (who === 'them') S.wb.edited = true; render(); return; }
  if (el.dataset.wbb) { const [who, k] = el.dataset.wbb.split(':'); S.wb[who].boosts[k] = +el.value; render(); return; }
  if (el.dataset.wbhp) { S.wb[el.dataset.wbhp].hpPct = Math.max(1, Math.min(100, parseInt(el.value, 10) || 100)); render(); return; }
});
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset.wbsp) { const [who, k] = el.dataset.wbsp.split(':'); S.wb[who].set.sp[k] = +el.value; if (who === 'them') S.wb.edited = true; liveWb(); }
  else if (el.dataset.sp) { const x = curSet(); x.sp[el.dataset.sp] = +el.value; const row = el.closest('.srow'); row.querySelector('.num').textContent = el.value; row.querySelector('.fin').textContent = stats(x.spc, x)[el.dataset.sp]; }
  else if (el.dataset.f === 'nick') curSet().nick = el.value.slice(0, 18);
});
document.addEventListener('focusin', (e) => { const el = e.target; if (el.dataset && el.dataset.move !== undefined && S.focusMove !== +el.dataset.move) { S.focusMove = +el.dataset.move; const pos = el.value.length; render(); const n = document.querySelector(`[data-move="${el.dataset.move}"]`); if (n) { n.focus(); n.setSelectionRange(pos, pos); } } });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.wb) { e.preventDefault(); closeWb(); } });
window.addEventListener('popstate', () => { if (S.wb) closeWb(true); });
render();
</script>
</body>
</html>
